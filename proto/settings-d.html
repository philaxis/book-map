<!doctype html>
<html lang="ko">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>서재 지도 · 설정 시안 D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="user.css">
<style>
:root{color-scheme:light;--bg:#fafaf9;--fg:#1c1d21;--mut:#6b7079;--card:rgba(255,255,255,.92);--solid:#fff;--line:#e3e5e9;--chip:#f1f2f4;--acc:#d4612a;--acc-ink:#fff;--shadow:0 8px 28px rgba(20,24,32,.10);--grey:#c9cdd3;--axis:#c3c7ce}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1014;--fg:#e6e7ea;--mut:#959aa4;--card:rgba(24,27,33,.92);--solid:#181b21;--line:#2a2e36;--chip:#232730;--acc:#ff8b4f;--acc-ink:#1a0e06;--shadow:0 8px 28px rgba(0,0,0,.45);--grey:#3a3f48;--axis:#4a505b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1014;--fg:#e6e7ea;--mut:#959aa4;--card:rgba(24,27,33,.92);--solid:#181b21;--line:#2a2e36;--chip:#232730;--acc:#ff8b4f;--acc-ink:#1a0e06;--shadow:0 8px 28px rgba(0,0,0,.45);--grey:#3a3f48;--axis:#4a505b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:14px/1.5 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc)}
button,select,input{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}

/* 컨트롤: 왼쪽 위 카드 하나, 기본은 접힘(검색 + 버튼 둘) */
#ctl{position:fixed;left:16px;top:16px;z-index:20;width:340px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#top{display:flex;align-items:center;gap:6px;padding:8px}
#top .brand{font-weight:700;font-size:15px;padding:0 4px 0 6px;white-space:nowrap;letter-spacing:-.01em}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--solid);border-radius:9px;padding:7px 10px;font-size:14px;outline:none}
#q:focus{border-color:var(--acc)}
.ib{flex:none;width:34px;height:34px;border:1px solid transparent;background:none;border-radius:9px;cursor:pointer;display:grid;place-items:center;color:var(--mut)}
.ib:hover{background:var(--chip);color:var(--fg)}
.ib.on{color:var(--acc);background:var(--chip)}
.ib svg{width:18px;height:18px}
#more{display:none;border-top:1px solid var(--line);padding:12px 14px 14px;max-height:calc(100vh - 90px);overflow:auto}
#ctl.open #more{display:block}
.sec{margin-bottom:14px}
.sec:last-child{margin-bottom:0}
.sec>h4{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,.chipbtn{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on,.chipbtn.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.seg.big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.big button{min-height:42px;padding:8px 6px;border-radius:10px;font-size:13px;white-space:nowrap}
.seg.sizes button{padding:6px 14px}
select.sel{width:100%;min-height:36px;border:1px solid var(--line);background:var(--solid);border-radius:9px;padding:6px 8px;font-size:13px}
#adv{border-top:1px solid var(--line);padding-top:10px;margin-bottom:0}
#adv>summary{font-size:13px;font-weight:600;color:var(--mut);padding:2px 0 8px}
#adv .advbody{padding-top:2px}
#adv .sec:last-child{margin-bottom:0}
.axes{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center}
.axes label{font-size:12px;color:var(--mut)}
.axes select{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:5px 6px;font-size:13px}
.axes .miss{grid-column:2;margin-top:-4px;font-size:11px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
details{border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px}
details summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--mut);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.fgrp{margin-top:9px}
.fgrp b{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:4px}
.fgrp .seg button{padding:2px 9px;font-size:12px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.links a{text-decoration:none}
.hint{font-size:12px;color:var(--mut);margin-top:8px}

/* 검색 결과(search.js): 검색창 아래 붙은 카드 목록. 접으면 '결과 N개' 한 줄 */
#results{position:fixed;left:16px;top:66px;width:min(480px,calc(100% - 32px));max-height:min(70vh,640px);z-index:25;background:var(--solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#results.on{display:flex}
#results .sbar{flex:none;display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;cursor:pointer;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
#results .sbar:hover{background:var(--chip)}
#results .sbar b{font-weight:700;white-space:nowrap}
#results .sst{flex:1;min-width:0;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .sst.ld::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#results .sfold{flex:none;color:var(--mut);font-size:12px;display:flex;align-items:center;gap:4px}
#results .sfold i{font-style:normal;display:inline-block;transition:transform .15s}
#results.fold .sfold i{transform:rotate(180deg)}
#results.fold .sbar{border-bottom:0}
#results.fold .slist{display:none}
#results .slist{overflow:auto;padding:4px;overscroll-behavior:contain}
#results .snone{padding:14px 10px;color:var(--mut);font-size:13px}
#results .rr{display:flex;gap:9px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
#results .rr:hover,#results .rr.act{background:var(--chip)}
#results .rr.cur{border-color:var(--acc);background:var(--chip)}
#results .rr.cur .rk{color:var(--acc);font-weight:700}
#results .rk{flex:none;width:18px;text-align:right;color:var(--mut);font-size:12px;padding-top:1px}
#results .rm{flex:1;min-width:0}
#results .rt{font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .ra{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .rs{color:var(--mut);font-size:12px;line-height:1.4;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#results .rf{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11px}
#results .rkind{border-radius:999px;padding:0 7px;background:var(--chip);color:var(--mut)}
#results .rkind.sem{color:#2c6e9e}
#results .rkind.both{color:var(--acc)}
.sbadge{display:inline-block;vertical-align:middle;margin-left:6px;padding:0 7px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--mut);font-size:11px;font-weight:500;line-height:18px;white-space:nowrap}
#results .rsc{color:var(--mut);font-variant-numeric:tabular-nums}
#results .rd{margin-left:auto;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}

/* 최근 검색(빈 검색창에 포커스) */
#results .rch{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
#results .rch b{color:var(--fg);font-size:13px;font-weight:600}
#results .rca{margin-left:auto;border:0;background:none;color:var(--mut);font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}
#results .rca:hover{background:var(--chip);color:var(--fg)}
#results .rc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
#results .rc:hover,#results .rc.act{background:var(--chip)}
#results .rci{flex:none;width:16px;height:16px;color:var(--mut)}
#results .rci svg{width:16px;height:16px;display:block}
#results .rct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#results .rcx{flex:none;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--mut);font-size:16px;cursor:pointer;line-height:1}
#results .rcx:hover{background:var(--line);color:var(--fg)}

/* 정보 패널 */
#panel{position:fixed;top:16px;right:16px;bottom:16px;width:380px;z-index:30;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto;padding:16px 18px 24px;transform:translateX(calc(100% + 24px));transition:transform .22s ease;overscroll-behavior:contain}
#panel.open{transform:none}
#panel .grab{display:none}
#panel .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;border-radius:8px}
#panel .x:hover{background:var(--chip)}
#panel .drive{display:block;text-align:center;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:600;padding:11px;border-radius:10px;margin:26px 0 16px}
#panel h2{font-size:19px;margin:0 0 4px;line-height:1.35;letter-spacing:-.01em}
#panel .au{color:var(--mut);margin-bottom:10px}
#panel .chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
#panel .chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip)}
#panel .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
#panel p{margin:10px 0;line-height:1.6}
#panel h3{font-size:12px;color:var(--mut);margin:20px 0 6px;font-weight:600;letter-spacing:.02em}
#panel .score{display:grid;grid-template-columns:72px 1fr 18px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
#panel .score i{display:block;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
#panel .score i b{display:block;height:100%;background:var(--acc)}
#panel .score small{grid-column:2;margin-top:-5px;color:var(--mut);display:flex;justify-content:space-between;font-size:11px}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
#panel li:last-child{border-bottom:0}
#panel li.nb{cursor:pointer;display:flex;gap:8px;align-items:center}
#panel li.nb:hover span{color:var(--acc)}
#panel li.nb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel li.nb em{font-style:normal;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#panel li.nb .dot{width:8px;height:8px;border-radius:50%;flex:none}
#panel li a{text-decoration:none}
#panel .mut{color:var(--mut)}
#panel .pt li{padding:8px 0}
#panel .pt .ph{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
#panel .pt .pn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .pt .pw{margin-left:auto;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#panel .pt .pb{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
#panel .pt .pb b{display:block;height:100%;background:var(--acc);border-radius:3px}
#panel .pt .ch{color:var(--mut);font-size:11px;line-height:1.45;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 정보 패널 위: 지나온 책(뒤로/앞으로 · 빵부스러기) */
#panel .navh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 4px}
#panel .nvb{flex:none;width:30px;height:30px;border:1px solid var(--line);background:var(--solid);border-radius:8px;cursor:pointer;color:var(--fg);font-size:15px;line-height:1;display:grid;place-items:center}
#panel .nvb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
#panel .nvb:disabled{opacity:.35;cursor:default}
#panel .nvc{flex:none;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:2px}
#panel .navt{flex:1 1 100%;display:flex;align-items:center;gap:2px;min-width:0;font-size:12px;color:var(--mut);overflow:hidden;white-space:nowrap;margin-bottom:8px}
#panel .navt .crm{flex:0 1 auto;min-width:0;max-width:96px;border:0;background:none;padding:2px 4px;font-size:12px;color:var(--mut);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:5px}
#panel .navt .crm:hover{background:var(--chip);color:var(--fg)}
#panel .navt .crm.on{color:var(--acc);font-weight:600}
#panel .navt .sep{flex:none;color:var(--line)}

/* 이름표·툴팁·범례·상태 */
.lbl{position:fixed;z-index:12;pointer-events:none;font-size:12px;color:var(--fg);background:var(--card);padding:1px 6px;border-radius:5px;white-space:nowrap;transform:translate(9px,-50%);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.lbl.sel{font-weight:800;font-size:13px;color:var(--acc-ink);background:var(--acc);box-shadow:0 2px 12px rgba(0,0,0,.28);z-index:13;padding:2px 8px;border-radius:7px}
.lbl.grp{transform:translate(-50%,-50%);font-weight:700;font-size:13px;color:var(--mut);background:none;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);letter-spacing:-.01em}
.lbl.amb{font-size:11px;max-width:170px;opacity:.85}
.lbl.hov{box-shadow:0 0 0 1px var(--acc);background:var(--solid);opacity:1}
.axl{position:fixed;z-index:11;pointer-events:none;font-size:12px;color:var(--mut);white-space:nowrap;transform:translate(-50%,-50%)}
.axl b{color:var(--fg);font-weight:600}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--solid);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);padding:5px 9px;border-radius:8px;font-size:13px;max-width:340px;display:none}
#tip small{display:block;color:var(--mut);font-size:12px}
#tip b,#tip small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip b{display:block;font-weight:600}
#legend{position:fixed;left:16px;bottom:16px;z-index:15;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:min(52vw,460px);max-height:30vh;overflow:auto;line-height:1.9}
#legend .it{white-space:nowrap;margin-right:10px;display:inline-block}
#legend .it i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-.5px}
#legend .ramp{display:flex;align-items:center;gap:8px}
#legend .ramp i{display:block;width:140px;height:8px;border-radius:4px}
#status{position:fixed;right:16px;bottom:16px;z-index:15;font-size:12px;color:var(--mut);pointer-events:none;text-align:right}
#edge{position:fixed;z-index:14;display:none;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:var(--acc);color:var(--acc-ink);box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--bg) 70%,transparent);cursor:pointer;place-items:center;transform:translate(-50%,-50%)}
#edge.on{display:grid}
#edge svg{width:24px;height:24px;transform:rotate(var(--a,0deg))}
#edge:hover{filter:brightness(1.06)}
#legend .lt{display:none}

/* 터치: 점을 누르면 뜨는 작은 카드(책 이름 + 드라이브·상세) */
#card{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:28;width:min(520px,calc(100% - 20px));display:none;align-items:center;gap:8px;padding:6px 6px 6px 14px;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#card.open{display:flex}
#card .cm{flex:1;min-width:0}
#card .cm b,#card .cm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .cm b{font-weight:650;line-height:1.35}
#card .cm small{color:var(--mut);font-size:12px}
#card .cb{flex:none;min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--solid);border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg);cursor:pointer}
#card .cb.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#card .cb.bk{font-size:17px;padding:0 10px}
#card .cb[hidden]{display:none}
#card .cb[aria-disabled="true"]{opacity:.4;pointer-events:none}
#results .semon{display:block;width:calc(100% - 8px);margin:4px;min-height:44px;border:1px dashed var(--line);background:var(--chip);border-radius:9px;font-size:13px;cursor:pointer;color:var(--fg)}

/* 터치 기기: 누르는 곳 44px, 범례 접기, 노치 안전 영역 */
@media (pointer:coarse){
  button,a,select,input{touch-action:manipulation}
  #results .slist,#panel,#more,#legend{touch-action:pan-y}
  .ib{width:44px;height:44px}
  #q{min-height:40px;font-size:16px}  /* 16px 미만이면 iOS 가 입력할 때 확대한다 */
  .btn{min-height:44px;padding:5px 14px}
  .seg button,.chipbtn{min-height:38px;padding:4px 13px}
  .seg.big button{min-height:44px}
  .seg.sizes button{min-height:40px}
  select.sel{min-height:44px}
  #edge{width:50px;height:50px}
  .fgrp .seg button{min-height:36px;padding:2px 11px}
  .axes select{min-height:40px}
  #panel .x{width:44px;height:44px;top:4px;right:4px}
  #panel li.nb{min-height:44px}
  #panel .nvb{width:40px;height:40px}
  #results .rc{min-height:44px}
  #results .rcx{width:36px;height:36px}
  #results .sbar{min-height:44px}
  #results .rd{padding:6px 10px}
  #ctl{left:max(16px,env(safe-area-inset-left))}
  #panel{right:max(16px,env(safe-area-inset-right))}
  #legend .lt{display:inline-flex;align-items:center;min-height:36px;border:0;background:none;padding:0 4px;color:var(--mut);font-size:12px;cursor:pointer}
  #legend.fold{padding:0 6px}
  #legend.fold .lb{display:none}
}

/* 폰: 컨트롤·정보 패널은 하단 시트 */
@media (max-width:720px){
  #ctl{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:auto;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--solid)}  /* 블러는 fixed 자식(#more 시트)의 기준을 바꾼다 */
  #ctl #more{position:fixed;left:0;right:0;bottom:0;max-height:62vh;background:var(--solid);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(16px + env(safe-area-inset-bottom));z-index:35}
  #ctl #more::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
  #top .brand{display:none}
  #results{left:10px;width:calc(100% - 20px);top:calc(62px + env(safe-area-inset-top));max-height:none}
  #results:not(.fold){top:auto;left:0;right:0;bottom:0;width:auto;max-height:60vh;border-radius:16px 16px 0 0;border-bottom:0;z-index:36;padding-bottom:env(safe-area-inset-bottom)}
  #results:not(.fold)::before{content:"";display:block;flex:none;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  body.sopen #legend,body.sopen #status{display:none}

const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const hitBook = h => h.object === partPoints ? PM[h.index].b : h.object === centerPoints ? CB[h.index] : h.index;
function pickAt(cx, cy) {
  mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  ray.params.Points.threshold = camera.position.distanceTo(controls.target) * (isTouch ? 0.03 : 0.014);
  const objs = partMix > 0.05 ? [cloud, partPoints, centerPoints] : [cloud];
  const hits = ray.intersectObjects(objs).filter(h => h.object === partPoints ? palpha[h.index] > 0.01
    : h.object === centerPoints ? calpha[h.index] > 0.01 : (alpha[h.index] > 0.01 || h.index === selected));
  if (!hits.length) return -1;
  hits.sort((a, b) => a.distanceToRay - b.distanceToRay || a.distance - b.distance);
  return hitBook(hits[0]);
}
// 손가락: 화면에서 반경 r(px) 안의 가장 가까운 점(겹치면 앞쪽)
function pickNear(cx, cy, r = 24) {
  let best = -1, bd = r * r, bz = 2;
  const test = (i, x, y, z) => {
    const dx = (x + 1) / 2 * innerWidth - cx, dy = (1 - y) / 2 * innerHeight - cy, d = dx * dx + dy * dy;
    if (d < bd - 4 || (d <= bd + 4 && z < bz)) { best = i; bd = Math.min(bd, d); bz = z; }
  };
  for (let i = 0; i < n; i++) {
    if (alpha[i] <= 0.01 && i !== selected) continue;
    v3.fromArray(cur, i * 3).project(camera);
    if (v3.z <= 1) test(i, v3.x, v3.y, v3.z);
  }
  if (partMix > 0.05) {
    for (let j = 0; j < m; j++) {
      if (palpha[j] <= 0.01) continue;
      v3.fromArray(pcur, j * 3).project(camera);
      if (v3.z <= 1) test(PM[j].b, v3.x, v3.y, v3.z);
    }
    for (let ci = 0; ci < CB.length; ci++) {
      if (calpha[ci] <= 0.01) continue;
      v3.fromArray(cur, CB[ci] * 3).project(camera);
      if (v3.z <= 1) test(CB[ci], v3.x, v3.y, v3.z);

}
// 두 번 탭: 그 자리로 확대(점이 있으면 그 점, 없으면 손가락 밑 방향)
function zoomAt(cx, cy, i) {
  const t = controls.target.clone(), off = camera.position.clone().sub(t);
  let p;
  if (i >= 0) p = new THREE.Vector3().fromArray(cur, i * 3);
  else {
    mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    p = ray.ray.at(off.length(), new THREE.Vector3());
  }
  t.lerp(p, i >= 0 ? 1 : 0.5);
  off.setLength(Math.max(controls.minDistance * 2, off.length() * 0.5));
  fly = { t, c: t.clone().add(off) };
}
const tip = $("tip");
function showTip(x, y, i) {

  tip.style.display = "block";

const hideTip = () => { tip.style.display = "none"; };
let down = null, lastTap = null;
const fingers = new Set();
renderer.domElement.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse") fingers.add(e.pointerId);
  // 두 손가락(핀치·이동)이 섞인 동작은 탭이 아니다
  down = fingers.size > 1 ? null : { x: e.clientX, y: e.clientY, t: performance.now() }; setRotate(false); fly = null;
  if (narrow() && $("ctl").classList.contains("open")) { $("ctl").classList.remove("open"); $("toggle").classList.remove("on"); setSheet(); down = null; }  // 폰: 지도를 누르면 설정 시트를 닫는다
});

renderer.domElement.addEventListener("pointerup", e => {

    if (down && e.button === 0 && performance.now() - down.t <= 350 && Math.hypot(e.clientX - down.x, e.clientY - down.y) <= 10) {
      const key = labelAt(e.clientX, e.clientY);

    }
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || e.button !== 0) return;

let hoverLbl = null;
function setHoverLbl(key) {

}

});

  const row = (id, label, html, k) => `<label for="${id}">${label}</label><select id="${id}">${html}</select>${miss(k)}`;
  $("axes").innerHTML =
    row("ax-x", "가로", opt(AXIS_KEYS.filter(k => k !== "none"), k => VARS[k].label, S.x), S.x)
    + row("ax-y", "깊이", opt(AXIS_KEYS, k => VARS[k].label, S.y), S.y)
    + row("ax-z", "높이", opt(AXIS_KEYS, k => VARS[k].label, S.z), S.z);
  for (const [id, key] of [["ax-x", "x"], ["ax-y", "y"], ["ax-z", "z"]])
    $(id).addEventListener("change", e => { S[key] = e.target.value; changed(true); });
}
$("color").addEventListener("change", e => { S.color = e.target.value; changed(false); });
$("sizes").addEventListener("click", e => {
  const b = e.target.closest("button[data-size]"); if (!b) return;
  S.size = b.dataset.size; changed(false);
});
function changed(moved) {
  saveURL(); presetsUI(); colorUI(); sizeUI(); axesUI(); legend();
  if (moved) layout(true);
  paint();
}
function splitUI() {
  document.querySelectorAll("#splitmode button").forEach(b => b.classList.toggle("on", +b.dataset.split === partsMode));
}
function setSplit(on) {
  partsMode = on ? 1 : 0;
  try { localStorage.setItem("bookmap-split", String(partsMode)); } catch (_) { /* 저장 불가 */ }
  splitUI();
  startPartAnim(true);
  paint();
}
$("splitmode").addEventListener("click", e => {
  const b = e.target.closest("button[data-split]"); if (!b) return;
  const on = b.dataset.split === "1";
  if (on === !!partsMode) return;
  setSplit(on);
});
function filtersUI() {
  $("fbody").innerHTML = FILTERS.map(([k, label, names]) =>
    `<div class="fgrp"><b>${label}</b><div class="seg">${names.map((nm, v) => `<button data-f="${k}" data-v="${v}" class="${F[k].has(v) ? "on" : ""}">${esc(nm)}</button>`).join("")}</div></div>`).join("")
    + `<div class="fgrp"><button class="btn" id="freset">필터 지우기</button></div>`;
  const on = FILTERS.reduce((s, [k]) => s + F[k].size, 0);
  $("fcount").textContent = on ? `· ${on}개 켜짐` : "";
}
$("fbody").addEventListener("click", e => {
  if (e.target.id === "freset") Object.values(F).forEach(s => s.clear());
  else { const b = e.target.closest("button[data-f]"); if (!b) return; const s = F[b.dataset.f], v = +b.dataset.v; s.has(v) ? s.delete(v) : s.add(v); }
  applyFilters(); filtersUI(); legend(); updateStatus(); paint();
});
$("k").addEventListener("input", e => { S.k = +e.target.value; $("kv").textContent = S.k; if (selected >= 0) showPanel(selected); paint(); });
rotBtn.addEventListener("click", () => setRotate(!controls.autoRotate));
$("iso").addEventListener("click", e => { isolate = !isolate; e.target.classList.toggle("on", isolate); paint(); });
$("reset").addEventListener("click", () => {
  select(-1);
  fly = { t: new THREE.Vector3(), c: home() };
  setRotate(!mobile());
});
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  renderer.setClearColor(new THREE.Color(css("--bg")));
  axisMat.color = new THREE.Color(css("--axis"));
  const acc = css("--acc"), dark = css("--bg") !== "#fafaf9";
  mat.uniforms.uAcc.value.set(acc);
  selDotMat.uniforms.uColor.value.set(acc);
  haloMat.uniforms.uColor.value.set(acc);
  haloMat.uniforms.uStr.value = dark ? 0.68 : 0.34;  // 라이트에선 발광을 옅게
  paint();
}
$("theme").addEventListener("click", () => {
  const dark = css("--bg") !== "#fafaf9";
  const t = dark ? "light" : "dark";
  try { localStorage.setItem("bookmap-theme", t); } catch (_) { /* 저장 불가 */ }
  applyTheme(t);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(document.documentElement.dataset.theme));
addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement !== $("q") && selected >= 0) select(-1); });
// 책 탐색 기록: Alt+←/→ 또는 [ / ]. 입력창에 포커스가 있으면 무시한다.
addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  const plain = !e.ctrlKey && !e.metaKey;
  if ((e.altKey && plain && e.key === "ArrowLeft") || (plain && !e.altKey && e.key === "[")) { e.preventDefault(); goNav(-1); }
  else if ((e.altKey && plain && e.key === "ArrowRight") || (plain && !e.altKey && e.key === "]")) { e.preventDefault(); goNav(1); }
});

// 범례: 터치 기기에선 기본 접힘('범례' 버튼으로 펼침)
let legendFold = isTouch;
function legend() {
  const c = COLORS[S.color];
  let body;
  if (c) {
    const counts = new Array(c.names.length).fill(0);
    for (let i = 0; i < n; i++) if (visible[i]) counts[c.get(P[i])]++;
    body = c.names.map((nm, k) => counts[k] ? `<span class="it"><i style="background:${c.pal[k % c.pal.length]}"></i>${esc(nm)} <span style="opacity:.7">${counts[k]}</span></span>` : "").join("");
  } else {
    const v = VARS[S.color];
    body = `<div class="ramp"><span>${esc(v.label)}</span><span>${esc(v.ends ? v.ends[0] : "")}</span><i style="background:linear-gradient(90deg,${RAMP.join(",")})"></i><span>${esc(v.ends ? v.ends[1] : "")}</span>${v.missing ? `<span>· 값 없음 ${v.missing}</span>` : ""}</div>`;
  }
  $("legend").innerHTML = `<button class="lt" type="button" aria-expanded="${!legendFold}">범례 ${legendFold ? "▸" : "▾"}</button><div class="lb">${body}</div>`;
  $("legend").classList.toggle("fold", legendFold);
}
$("legend").addEventListener("click", e => { if (e.target.closest(".lt")) { legendFold = !legendFold; legend(); } });
function updateStatus() {
  const vis = visible.reduce((a, b) => a + b, 0);
  $("status").textContent = vis === n ? `${n}권` : `${vis} / ${n}권`;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  shiftView();
  const pr = Math.min(devicePixelRatio, 2);
  mat.uniforms.scale.value = pr * Math.min(1, innerHeight / 800) * 0.9;
  pmat.uniforms.scale.value = cmat.uniforms.scale.value = mat.uniforms.scale.value;
  selDotMat.uniforms.scale.value = haloMat.uniforms.scale.value = mat.uniforms.scale.value;
  dirty = true;
}
addEventListener("resize", resize);

// 폰 뒤로가기: 상세 시트·설정 시트·검색 목록·카드가 열려 있으면 페이지를 떠나지 않고 하나씩 닫는다.
// 열린 게 있는 동안 history 에 표식 하나를 두고, 다 닫히면 그 표식을 되돌린다.
const resultsEl = $("results");
const layersOpen = () => mobile() && (panel.classList.contains("open") || $("ctl").classList.contains("open")
  || (resultsEl.classList.contains("on") && !resultsEl.classList.contains("fold")) || card.classList.contains("open"));
let guard = false, skipPop = 0;
function syncGuard() {
  const want = layersOpen();
  try {
    if (want && !guard) { history.pushState({ bookmapLayer: 1 }, "", location.href); guard = true; }
    else if (!want && guard) { guard = false; skipPop++; history.back(); }
  } catch (_) { /* 미리보기 등 */ }
}
function closeTop() {
  if (panel.classList.contains("open")) { if (selected >= 0) closeDetail(); else hidePanel(); }
  else if ($("ctl").classList.contains("open")) { $("ctl").classList.remove("open"); $("toggle").classList.remove("on"); setSheet(); }
  else if (resultsEl.classList.contains("on") && !resultsEl.classList.contains("fold")) dispatchEvent(new Event("searchfold"));
  else if (card.classList.contains("open")) select(-1);
}
addEventListener("popstate", () => {
  if (skipPop) skipPop--;
  else { guard = false; closeTop(); syncGuard(); }
  saveURL();  // 표식 위에서 바뀐 보기 설정을 지금 항목에 다시 적는다
});
const layerWatch = new MutationObserver(syncGuard);
for (const el of [panel, $("ctl"), resultsEl, card]) layerWatch.observe(el, { attributes: true, attributeFilter: ["class"] });
new MutationObserver(() => shiftView()).observe(resultsEl, { attributes: true, attributeFilter: ["class"] });  // 검색 목록 폭까지 반영

// 키보드: 보이는 영역(visualViewport)에 맞춰 검색 결과를 검색창 밑으로
const vv = window.visualViewport;
function vvSync() {
  if (!vv) return;
  document.documentElement.style.setProperty("--vvh", vv.height + "px");
  document.documentElement.style.setProperty("--vvt", vv.offsetTop + "px");
}
if (vv) { vv.addEventListener("resize", vvSync); vv.addEventListener("scroll", vvSync); vvSync(); }
$("q").addEventListener("focus", () => document.body.classList.toggle("kb", narrow()));
$("q").addEventListener("blur", () => document.body.classList.remove("kb"));
document.addEventListener("gesturestart", e => e.preventDefault());  // iOS: 페이지 핀치 확대 막기(지도 핀치는 three 가)

let savedTheme = null;
try { savedTheme = localStorage.getItem("bookmap-theme"); } catch (_) { /* 저장 불가 */ }
const advEl = $("adv");
try { advEl.open = localStorage.getItem("bookmap-adv") === "1"; } catch (_) { /* 저장 불가 */ }
advEl.addEventListener("toggle", () => {
  try { localStorage.setItem("bookmap-adv", advEl.open ? "1" : "0"); } catch (_) { /* 저장 불가 */ }
});
applyFilters(); filtersUI(); presetsUI(); splitUI(); colorUI(); sizeUI(); axesUI(); legend();
setRotate(!mobile());  // 버튼 표시를 맞춘다
layout(false);
resize();
applyTheme(savedTheme === "light" || savedTheme === "dark" ? savedTheme : null);
renderer.setAnimationLoop(now => {
  stepAnim(now);
  stepPartAnim(now);
  if (partMix > 0.005) updatePartLines();
  if (fly) {
    controls.target.lerp(fly.t, 0.1); camera.position.lerp(fly.c, 0.1);
    dirty = true;
    if (controls.target.distanceTo(fly.t) < 0.05 && camera.position.distanceTo(fly.c) < 0.05) fly = null;
  }
  const moved = controls.update();
  if (selected >= 0 && !reduceMotion.matches) dirty = true;  // 선택 표시의 숨쉬기·발광
  updateSelectedOverlay(now);
  if (mobile() && !moved && !dirty && !anim && !fly) return;  // 멈춘 화면은 다시 그리지 않는다(배터리)
  dirty = false;
  renderer.render(scene, camera);
  placeLabels();
});
if (document.fonts) document.fonts.ready.then(() => { dirty = true; });
window.MAP = { S, PRESETS, COLORS, VARS, RAMP, AXIS_KEYS, changed, get selected() { return selected; }, get partsMode() { return partsMode; } };
dispatchEvent(new Event("mapready"));
</script>
<script src="search.js"></script>
<script type="module" src="user.js"></script>
<script type="module" src="proto/settings-d.js"></script>
</body>
</html>
